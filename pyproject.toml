[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-research-pilot"
version = "1.0.0"
description = "A first runnable version of a creator research workflow, with the checks it refuses to skip."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pilot = "pilot.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
